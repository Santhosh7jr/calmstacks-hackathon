[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recoverai-core"
version = "0.1.0"
description = "Format-aware file damage analysis and recovery estimation engine for RecoverAI"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=11.3,<14",
  "pypdf>=6.1,<7",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "scikit-learn>=1.5,<2",
  "pandas>=2.2,<3",
  "joblib>=1.4,<2",
]

[tool.setuptools.packages.find]
include = ["recoverai_core*"]
